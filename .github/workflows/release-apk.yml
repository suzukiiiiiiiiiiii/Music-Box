name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Extract project
        shell: bash
        run: unzip -q music-box.zip -d extracted

      - name: Generate Android project
        working-directory: extracted/musicbox
        run: flutter create --platforms=android --project-name music_box --org com.example .

      - name: Apply Android manifest
        working-directory: extracted/musicbox
        shell: bash
        run: |
          if [ -f android_config/AndroidManifest.xml ]; then
            cp android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        working-directory: extracted/musicbox
        run: flutter pub get

      - name: Analyze
        working-directory: extracted/musicbox
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: extracted/musicbox
        run: flutter build apk --release --no-shrink

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Music Box APK ${{ github.run_number }}
          files: extracted/musicbox/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
